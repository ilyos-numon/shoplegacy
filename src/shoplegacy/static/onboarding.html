<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가게유산 · 기관 만들기</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/onboarding.css">
</head>
<body data-chrome="none">
  <main id="page" class="wrap onboarding" data-screen="onboarding">
    <p class="eyebrow">처음 한 번만</p>
    <h1 class="ob-title">기관 이름을 알려 주세요</h1>
    <p class="sub">가게와 카드는 이 기관 안에서만 보여요. 기관을 만든 분이 소유자가 돼요.</p>

    <form id="onboarding-form" class="stack" novalidate>
      <label class="fld"><span>기관 이름</span>
        <input class="inp" id="org-name" name="org-name" type="text" maxlength="100" autocomplete="organization" required placeholder="예: 가나다 소상공인지원센터"></label>
      <p id="onboarding-error" class="err" role="alert" hidden></p>
    </form>
  </main>
  <div class="sf">
    <button id="create-org" type="submit" form="onboarding-form" class="btn">기관 만들기</button>
  </div>
  <script nonce="__CSP_NONCE__" src="/static/vendor/gsap.min.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/motion.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/auth.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/onboarding.js"></script>
</body>
</html>
