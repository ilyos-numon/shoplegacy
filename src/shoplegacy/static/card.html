<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가게유산 · 카드</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/shell.css">
  <link rel="stylesheet" href="/static/card.css">
</head>
<body data-chrome="public">
  <main id="page" class="wrap card-page" data-screen="cards">
    <a class="back-link" href="/cards">← 카드 목록</a>

    <article class="archive" id="archive" aria-labelledby="card-title">
      <h1 id="card-title" class="archive-title">가게 유산 카드</h1>
      <dl class="bib" id="card-meta">
        <dt>기록 번호</dt><dd class="code" id="card-code">······</dd>
        <dt>업종 · 운영</dt><dd id="tags"></dd>
        <dt>근거</dt>
        <dd><span id="evidence-badge" class="evidence-summary" title="사장님 답변에서 근거를 찾은 문장 수 / 사장님 답변으로 확인한 문장 수" hidden></span>
          <span id="reviewer-marker" class="evidence-summary" title="사장님 답변이 아니라 검수자가 직접 쓴 문장 수예요. 근거 수에 넣지 않았어요." hidden></span></dd>
      </dl>
      <p id="error" class="err" role="alert" hidden></p>

      <div class="story" id="card-story">
        <section data-axis="location"><h2>입지</h2><p class="body"></p></section>
        <section data-axis="suppliers"><h2>거래처</h2><p class="body"></p></section>
        <section data-axis="menu"><h2>메뉴</h2><p class="body"></p></section>
        <section data-axis="pricing"><h2>가격</h2><p class="body"></p></section>
        <section data-axis="customers"><h2>손님</h2><p class="body"></p></section>
        <section data-axis="failures"><h2>실패</h2><p class="body"></p></section>
      </div>
    </article>

    <section id="feedback" class="card-feedback" aria-labelledby="feedback-title" hidden>
      <h2 id="feedback-title">이 카드가 도움이 됐나요?</h2>
      <div class="fb">
        <button id="feedback-up" type="button" class="btn sec">도움됐어요</button>
        <button id="feedback-down" type="button" class="btn sec">아쉬워요</button>
      </div>
      <p id="feedback-counts" class="hint" role="status"></p>
      <p id="feedback-thanks" class="info" role="status" hidden></p>
    </section>

    <section id="next-actions" class="panel staff-extra" aria-labelledby="next-actions-title" hidden>
      <h2 id="next-actions-title" class="eyebrow">담당자에게만 보여요</h2>
      <div class="stack">
        <button id="next-round-btn" type="button" class="btn sec">같은 가게 다음 회차 시작</button>
        <a id="review-link" class="btn quiet" href="#">검수 화면</a>
        <a id="cards-link" class="btn quiet" href="/cards">카드 목록 보기</a>
      </div>
      <p id="next-round-note" class="hint" role="status"></p>
    </section>
  </main>
  <script nonce="__CSP_NONCE__" src="/static/vendor/gsap.min.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/motion.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/labels.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/auth.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/shell.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/card.js"></script>
</body>
</html>
