<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가게유산 · 테스트 결제</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/shell.css">
  <link rel="stylesheet" href="/static/pay_test.css">
</head>
<body data-chrome="staff">
  <main id="page" class="wrap pay-page" data-screen="dashboard">
    <section id="pay-test" class="pay-sheet" aria-labelledby="pay-heading">
      <div class="pay-grab" aria-hidden="true"></div>
      <div class="pay-head">
        <h1 id="pay-heading">테스트 결제</h1>
        <a class="pay-back" href="/billing" aria-label="요금제 화면으로 돌아가기">×</a>
      </div>
      <p class="pay-note">시험용 결제 화면이에요. 실제 카드에서 돈이 빠져나가지 않아요.</p>
      <h2 id="pay-title" class="sr-only">결제 내용</h2>
      <dl class="pay-detail">
        <div>
          <dt>주문 번호</dt>
          <dd id="pay-order" class="code">-</dd>
        </div>
        <div id="pay-amount-row">
          <dt>결제 금액</dt>
          <dd id="pay-amount">-</dd>
        </div>
      </dl>
      <button id="pay-confirm" type="button" class="btn">결제 완료</button>
      <p id="pay-result" class="info" role="status" aria-live="polite"></p>
      <p class="hint pay-foot"><a href="/billing">요금제 화면으로 돌아가기</a></p>
    </section>
  </main>
  <script nonce="__CSP_NONCE__" src="/static/vendor/gsap.min.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/motion.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/auth.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/shell.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/pay_test.js"></script>
</body>
</html>
