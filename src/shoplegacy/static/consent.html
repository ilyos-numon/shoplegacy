<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가게유산 · 동의 받기</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/shell.css">
  <link rel="stylesheet" href="/static/consent.css">
</head>
<body data-chrome="staff">
  <main id="page" class="wrap consent" data-screen="home">
    <p class="eyebrow">가게 <span class="code" id="consent-code">······</span> · 인터뷰 전</p>
    <h1 class="consent-title">사장님께 동의를 받아 주세요</h1>
    <p class="sub">한 줄씩 읽어 드리고, 동의하시는 항목만 켜 주세요. 나중에 철회할 수 있어요.</p>
    <p class="hint" id="consent-shop-tags"></p>

    <form id="consent-form" novalidate>
      <div class="consent-row" data-stagger>
        <b id="lb-recording">대화 녹음<span class="req opt">꺼도 돼요</span></b>
        <label class="switch"><input type="checkbox" id="consent-recording" checked aria-labelledby="lb-recording"></label>
        <p>끄면 마이크 대신 직접 입력으로 진행해요. 녹음은 글로 옮긴 뒤 바로 지워요.</p>
      </div>
      <div class="consent-row" data-stagger>
        <b id="lb-retention">기록 보관<span class="req">필수</span></b>
        <label class="switch"><input type="checkbox" id="consent-retention" checked disabled aria-labelledby="lb-retention"></label>
        <p>답변을 기관이 정한 보관 기간 동안 보관해요.</p>
      </div>
      <div class="consent-row" data-stagger>
        <b id="lb-llm">AI 정리<span class="req">필수</span></b>
        <label class="switch"><input type="checkbox" id="consent-llm" checked disabled aria-labelledby="lb-llm"></label>
        <p>답변을 카드 문장으로 정리할 때 AI를 써요. 이름·상호는 먼저 가려요.</p>
      </div>
      <div class="consent-row" data-stagger>
        <b id="lb-publish">카드 공개</b>
        <label class="switch"><input type="checkbox" id="consent-publish" checked aria-labelledby="lb-publish"></label>
        <p>사장님이 확인한 카드만 누구나 볼 수 있게 공개해요.</p>
      </div>

      <div class="fld consent-method-fld">
        <span id="lb-method">동의 받은 방법</span>
        <div class="pills" id="consent-method" role="radiogroup" aria-labelledby="lb-method" data-value="verbal">
          <button type="button" role="radio" data-value="verbal" aria-checked="true">말로</button>
          <button type="button" role="radio" data-value="written" aria-checked="false">서면</button>
          <button type="button" role="radio" data-value="link" aria-checked="false">링크</button>
        </div>
      </div>

      <p class="err" id="consent-error" role="alert" hidden></p>
      <div class="consent-foot">
        <button class="btn" type="submit" id="consent-save">동의 기록하고 인터뷰 시작</button>
      </div>
    </form>

    <section class="consent-history" aria-labelledby="consent-history-title">
      <h2 id="consent-history-title">받은 동의</h2>
      <p class="hint" id="consent-table-empty" hidden>아직 기록한 동의가 없어요.</p>
      <ul id="consent-table"></ul>
    </section>
  </main>

  <script nonce="__CSP_NONCE__" src="/static/vendor/gsap.min.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/motion.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/labels.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/auth.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/shell.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/consent.js"></script>
</body>
</html>
