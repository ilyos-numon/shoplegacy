<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가게유산</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/shell.css">
  <link rel="stylesheet" href="/static/home.css">
</head>
<body data-chrome="staff">
  <main id="page" class="wrap home" data-screen="home">
    <h1 class="home-title">가게유산</h1>
    <p class="sub">사장님이 말로 들려준 장사 이야기를 익명 카드로 남겨요.</p>

    <section class="next-up" id="next-up" aria-live="polite" hidden>
      <span class="eyebrow">이어서 할 일</span>
      <b id="next-up-text"></b>
      <span class="next-up-sub" id="next-up-sub"></span>
      <button class="btn" type="button" id="next-up-btn"></button>
    </section>

    <ol class="journey" id="journey" aria-label="가게 한 곳이 거치는 여섯 단계">
      <li>등록</li><li>동의</li><li>인터뷰</li><li>검수</li><li>사장님 확인</li><li>공개</li>
    </ol>

    <section class="shops" aria-labelledby="shops-title">
      <h2 id="shops-title">등록한 가게</h2>
      <p class="hint">가게 이름 대신 가게 코드로 보여 드려요.</p>
      <p id="list-error" class="err" role="alert" hidden></p>
      <p id="shop-list-empty" class="hint" hidden>아직 등록한 가게가 없어요. 아래 "새 가게" 버튼으로 등록해 주세요.</p>
      <ul id="shop-list"></ul>
    </section>

    <button class="fab" type="button" id="new-shop-btn" aria-haspopup="dialog" aria-controls="sheet-shop">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="1.8"/></svg>새 가게</button>
  </main>

  <div class="sheet" id="sheet-shop" hidden role="dialog" aria-modal="true" aria-label="새 가게 등록">
    <div class="sh-h"><h2>새 가게 등록</h2>
      <button type="button" class="sheet-close" data-close aria-label="닫기">×</button></div>
    <form class="stack" id="shop-form" novalidate>
      <p class="hint">상호, 사장님 성함, 거래처 이름은 저장 후 어디에도 다시 보이지 않아요. 목록에는 가게 코드만 나와요.</p>
      <div class="grid2">
        <label class="fld"><span>가게 이름</span>
          <input class="inp" id="shop-name" name="name" type="text" required maxlength="100" placeholder="예: 가나다식당"></label>
        <label class="fld"><span>사장님 성함</span>
          <input class="inp" id="owner-name" name="owner_name" type="text" required maxlength="50" placeholder="예: 홍길동"></label>
      </div>
      <div class="grid2">
        <label class="fld"><span>업종 <small>(질문지가 달라져요)</small></span>
          <select class="inp" id="trade" name="trade">
            <option value="restaurant" selected>식당</option>
            <option value="cafe">카페</option>
          </select></label>
        <label class="fld"><span>동네 유형</span>
          <select class="inp" id="area-type" name="area_type">
            <option value="residential" selected>주택가</option>
            <option value="station">역세권</option>
            <option value="office">오피스가</option>
            <option value="other">기타</option>
          </select></label>
      </div>
      <div class="grid2">
        <label class="fld"><span>운영 연수 (년)</span>
          <input class="inp" id="years" name="years" type="number" min="0" max="100" required inputmode="numeric" placeholder="예: 18"></label>
        <label class="fld"><span>폐업 연도</span>
          <input class="inp" id="closed-year" name="closed_year" type="number" min="1900" max="2100" required inputmode="numeric" placeholder="예: 2026"></label>
      </div>
      <p class="opt-title">지역·거래처 (선택)</p>
      <div class="grid2">
        <label class="fld"><span>시·도</span>
          <select class="inp" id="region-sido" name="region_sido" aria-label="시·도">
            <option value="">선택 안 함</option>
          </select></label>
        <label class="fld"><span>시·군·구</span>
          <select class="inp" id="region-sigungu" name="region_sigungu" aria-label="시·군·구" disabled>
            <option value="">시·도를 먼저 골라 주세요</option>
          </select></label>
      </div>
      <p id="region-error" class="hint" role="status" hidden></p>
      <label class="fld"><span>거래처 이름 <small>(쉼표로 구분)</small></span>
        <input class="inp" id="supplier-names" name="supplier_names" type="text" placeholder="예: 가나정육, 다라채소"></label>

      <p id="form-error" class="err" role="alert" hidden></p>
      <button id="start-btn" type="submit" class="btn">등록하고 동의 받기</button>
    </form>
  </div>

  <script nonce="__CSP_NONCE__" src="/static/vendor/gsap.min.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/motion.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/labels.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/auth.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/shell.js"></script>
  <script nonce="__CSP_NONCE__" src="/static/index.js"></script>
</body>
</html>
