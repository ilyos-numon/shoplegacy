[project]
name = "shoplegacy"
version = "0.1.0"
description = "Small-business legacy cards from voice interviews"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7", "pyyaml>=6.0", "httpx>=0.27", "python-multipart>=0.0.9", "handoff",
    "psycopg[binary,pool]>=3.2", "pyjwt[crypto]>=2.9", "structlog>=24",
    "secure>=1.0", "sentry-sdk>=2.0", "cryptography>=43", "openpyxl>=3.1",
    "opentelemetry-sdk>=1.45", "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-exporter-otlp-proto-http>=1.45", "procrastinate>=3.10", "fsspec>=2026.9", "limits>=5"]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0", "av>=14,<17"]
ner = ["presidio-analyzer>=2.2", "spacy>=3.8", "python-mecab-ko>=1.3",
    "ko-core-news-md"]
sms = ["solapi>=5.0"]
s3 = ["s3fs>=2026.9"]

[tool.uv.sources]
handoff = { path = "../handoff" }
ko-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/ko_core_news_md-3.8.0/ko_core_news_md-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.48", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "pytest-postgresql>=6", "axe-playwright-python>=0.1.8", "websockets>=15", "vcrpy>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shoplegacy"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/e2e"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["handoff.*", "faster_whisper.*", "presidio_analyzer.*", "spacy.*", "solapi.*",
    "opentelemetry.*", "axe_playwright_python.*", "fsspec.*", "s3fs.*", "procrastinate.*"]
ignore_missing_imports = true
